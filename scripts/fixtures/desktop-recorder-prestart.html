<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* Structure and dimensions of the public 0.1.32 jYMI pre-record component. */
    body { margin:0; min-width:1140px; color:#27264d; font:14px sans-serif; background:#f4f7fc; }
    #root { display:flex; min-width:1140px; height:100vh; }
    nav { width:240px; flex:none; }
    .desktop-record { width:100%; min-width:1140px; height:100%; }
    .desktop-topbar { height:88px; min-width:1140px; }
    .viewport { padding:20px 112px; }
    .meeting-title { font-size:18px; }
    .leftContain { position:absolute; width:88px; height:100%; }
    .desktop-record > .content { display:flex; height:calc(100% - 88px); padding-left:112px; }
    .before-record { width:0; flex:7; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; }
    .setup { width:100%; display:flex; flex-direction:column; align-items:center; margin-bottom:64px; position:relative; }
    .illustration { width:320px; height:195px; position:relative; margin-bottom:50px; }
    .illustration > div { width:442px; height:310px; position:absolute; top:0; right:0; background:linear-gradient(135deg,#ece1ff,#f9d6e9); border-radius:40%; }
    .fields { display:flex; justify-content:center; align-items:center; flex-direction:column; width:100%; }
    .field { flex:1; padding:0 24px; }
    .field:first-child { padding-left:8px; }
    .field:last-child { padding-left:8px; margin-top:16px; }
    .langLineSpan,.field-label { font-size:12px; line-height:20px; margin-bottom:8px; }
    .languages { display:flex; }
    .languages > div { border:1px solid #ddd; border-radius:8px; width:120px; min-width:120px; height:36px; display:flex; align-items:center; justify-content:center; }
    .languages > div:not(:last-child) { margin-right:8px; }
    .translate-item-des { height:36px; width:376px; border:1px solid #ddd; border-radius:8px; display:flex; align-items:center; padding-right:8px; }
    .item-des { min-width:84px; margin-right:8px; margin-left:16px; white-space:nowrap; }
    .setup-start { width:376px; height:56px; margin:31px 24px 0 8px; display:flex; align-items:center; justify-content:center; background:#605ce5; color:white; border-radius:8px; font-size:18px; cursor:pointer; }
    .rightArea { width:0; flex:4; min-width:320px; background:white; }
    .versionMicTipHigh { position:absolute; top:369px; height:36px; display:flex; align-items:center; white-space:nowrap; background:white; }
  </style>
</head>
<body>
  <div id="root"><nav>电脑端导航</nav><div class="desktop-record">
    <div class="desktop-topbar"><div class="viewport"><div class="meeting-title">2026-11-01 测试记录</div><p>已保存</p></div></div>
    <div class="leftContain"><div class="backBox">返回</div></div>
    <div class="content"><div class="before-record"><div class="setup">
      <div class="illustration"><div></div></div>
      <div class="fields">
        <div class="field"><div class="langLineSpan">音频语言</div><div class="languages"><div class="lanBtnSelect ml8">中文</div><div class="ml8">英语</div><div data-e2e-test-id="beforeRecord_chooseLan_select">其他语言</div></div></div>
        <div class="field"><div class="field-label">翻译</div><span class="translate-item-des"><span class="item-des" data-e2e-test-id="beforeRecord_chooseTransLan_select">不翻译</span></span></div>
      </div>
      <div class="setup-start" data-e2e-test-id="beforeRecord_start_button" onclick="startRecording()">开始录音</div>
    </div></div><div class="rightArea">会议笔记</div></div>
  </div></div>
  <script>
    history.replaceState({}, '', '/doc/record');
    window.messages=[];
    if (!window.TingwuRecorder) window.TingwuRecorder={postMessage:message=>window.messages.push(JSON.parse(message))};
    window.preflightInstance=Date.now()+'-'+Math.random();
    window.preflightComplete=false;
    window.microphoneAllowed=false;
    window.probeMicrophone=async()=>{
      try {
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        window.microphoneAllowed=true;
        setTimeout(()=>stream.getTracks().forEach(track=>track.stop()),20);
      } catch(error) {
        window.microphoneAllowed=false;
        window.microphoneError=error.name;
      }
      window.preflightComplete=true;
    };
    window.startRecording=async()=>{
      if (!window.microphoneAllowed) return;
      window.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    };
    window.probeMicrophone();
  </script>
</body>
</html>
