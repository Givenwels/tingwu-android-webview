<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.6 sans-serif; color:#27264d; background:#f4f7fc; min-width:1280px; }
    #root { display:flex; min-width:1280px; height:100vh; }
    nav { width:240px; flex:none; }
    /* Geometry from the deployed FJt9, ytgv, +vzo and ARw7 recording components. */
    .desktop-record { min-width:1280px; width:100%; height:100%; display:flex; flex-direction:column; overflow:clip; position:relative; }
    .desktop-topbar { height:88px; flex:none; }
    .viewport { position:relative; height:100%; padding-left:112px; display:flex; justify-content:space-between; }
    .viewport > .left-area { height:100%; display:flex; align-items:center; }
    .titleContain { width:calc(45vw - 347px); display:flex; }
    .meeting-title-shell { display:flex; align-items:center; }
    .meeting-title { font-size:18px; font-weight:600; max-width:30vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* CdJi, the editable title actually used during recording (not ytgv's readonly label). */
    .file-title { margin:10px 26px 0 -14px; width:0; min-width:200px; flex:1; }
    .file-title-input { display:inline-block; position:relative; max-width:100%; }
    .file-title-field { height:28px; display:flex; align-items:center; border:1px solid transparent; }
    #record_title { background:none; border:0; height:100%; padding:0 8px; font:600 16px sans-serif; }
    .saveText { font-size:12px; color:#939596; white-space:nowrap; }
    .save-message { position:absolute; top:55px; margin-top:-13px; font-size:12px; color:#939596; }
    .leftContain { position:absolute; left:0; width:80px; height:100%; }
    .desktop-record > .content { width:calc(100% - 80px); margin:0 auto; margin-left:80px; height:0; flex-grow:1; display:flex; position:relative; }
    .desktop-record > .content > .left-area { width:0; height:100%; flex:7; display:flex; flex-direction:column; position:relative; }
    .summary-area { width:100%; height:0; flex-grow:1; display:flex; background:white; }
    .summary-container { width:0; flex-grow:1; display:flex; flex-direction:column; position:relative; overflow:hidden; margin:0 auto; }
    .transcript-frame { height:0; flex-grow:1; position:relative; overflow:hidden; }
    .container { padding:0 20px; }
    .editor-viewport { height:calc(100vh - 197px); width:calc(100% + 49px); margin-left:-22px; overflow:hidden; }
    .editor-scroll { height:100%; overflow:auto; padding:0 16px; }
    .top { display:flex; height:36px; position:absolute; top:-60px; right:25px; z-index:3; }
    .top-button { width:36px; height:36px; margin-left:16px; display:flex; align-items:center; justify-content:center; float:left; }
    .record-control-frame { height:107px; display:flex; align-items:center; }
    .bottomContain { width:100%; height:107px; margin:0 auto; display:flex; align-items:center; }
    .bottomContain > .content { flex-grow:1; }
    .ball { width:63px; height:63px; float:left; margin:0 26px 0 29px; }
    .running-text { display:flex; align-items:center; font-size:18px; line-height:28px; margin-top:11px; }
    .running-time { font-size:12px; padding-left:16px; margin-top:1px; line-height:18px; }
    .right-btn { display:flex; align-items:center; padding-right:25px; margin-top:24px; }
    .stop-btn,.play-btn { width:44px; height:36px; display:flex; align-items:center; justify-content:center; background:white; border-radius:8px; cursor:pointer; }
    .play-btn { margin-left:16px; }
    .rightArea { position:relative; flex:5; width:0; padding-top:1px; top:-60px; right:28px; z-index:2; margin-left:40px; height:calc(100% + 36px); }
    .notes-editor { height:100%; background:white; border-radius:8px; display:flex; flex-direction:column; }
    .notes-toolbar { height:44px; padding:8px 16px; white-space:nowrap; }
    .notes-body { flex:1; padding:16px; overflow:auto; }
    .notes-footer { padding:8px; color:#a0a0b0; text-align:center; border-top:1px solid #f0f0f4; }
  </style>
</head>
<body>
  <div id="root"><nav>电脑工作台</nav><div class="desktop-record">
    <div class="desktop-topbar"><div class="viewport"><div class="left-area"><div class="titleContain"><div class="file-title"><div class="file-title-input"><div class="file-title-field"><input id="record_title" type="text" value="2026-11-05 会议记录" onblur="window.savedTitle=this.value.trim()" onkeydown="if(event.key==='Enter')this.blur()"></div></div><div class="FileTitle--Bottom"><span class="saveText">已保存</span></div></div></div></div></div></div>
    <div class="leftContain"><div class="backBox">返回</div></div>
    <div class="content"><div class="left-area">
      <div class="summary-area">
        <div class="top"><div class="top-button" data-e2e-test-id="record_search_icon">搜索</div><div class="top-button">筛选</div><div class="top-button">翻译</div><div class="top-button">热词</div></div>
        <div class="summary-container"><div class="transcript-frame"><div class="container"><div class="editor-viewport"><div class="editor-scroll"><p>00:00　发言人 1</p><p>会议内容会在这里实时转写。每一段文字都应在手机屏幕内完整展示，不需要左右拖动。</p><p>00:08　发言人 2</p><p>转写、录音控制和会议笔记应依次排列，互不遮挡。</p></div></div></div></div></div>
      </div>
      <div class="record-control-frame"><div class="bottomContain"><div class="content"><div class="ball">听悟</div><div class="running-text"><span>录音中…</span></div><div class="running-time">00:20 / 02:00:00</div></div><div class="right-btn"><div class="stop-btn" data-e2e-test-id="record_finish_icon" onclick="finishRecord()">结束</div><a class="play-btn" data-e2e-test-id="record_stop_icon" onclick="togglePause()">暂停</a></div></div></div>
    </div><div class="rightArea"><div class="notes-editor"><div class="notes-toolbar">正文　11　 B　 A　···</div><div class="notes-body" contenteditable="true">会议笔记</div><div class="notes-footer">万语千言，心领神悟</div></div></div></div>
  </div></div>
  <script>
    history.replaceState({}, '', '/doc/record');
    window.messages=[];
    if(!window.TingwuRecorder) window.TingwuRecorder={postMessage:message=>window.messages.push(JSON.parse(message))};
    window.requestMic=async()=>{window.stream=await navigator.mediaDevices.getUserMedia({audio:true});};
    window.togglePause=()=>{
      window.paused=!window.paused;
      document.querySelector('.running-text span').textContent=window.paused?'录音已暂停':'录音中…';
      const button=document.querySelector('.play-btn');
      button.textContent=window.paused?'继续':'暂停';
      if(window.paused){button.removeAttribute('data-e2e-test-id');window.stream?.getTracks().forEach(track=>track.stop());}
      else {button.setAttribute('data-e2e-test-id','record_stop_icon');window.requestMic();}
    };
    window.finishRecord=()=>{
      window.stream?.getTracks().forEach(track=>track.stop());
      history.pushState({}, '', '/doc/transcripts/test-record');
      document.querySelector('#root').innerHTML='<div>录音已保存</div>';
    };
  </script>
</body>
</html>
